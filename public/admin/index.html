<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negas Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #121212; color: #fff; }
        .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #71717a; font-weight: 800; display: block; margin-bottom: 0.5rem; }
        th.field-label { display: table-cell; margin-bottom: 0; }
        .input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 0.875rem 1rem; font-family: 'Inter', sans-serif; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        .input:focus { border-color: #fff; }
        .btn-red { background: #D20000; color: #fff; padding: 1rem; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.05em; font-size: 1.1rem; border: none; cursor: pointer; transition: background 0.3s; width: 100%; }
        .btn-red:hover { background: #b00000; }
        .btn-red:disabled { opacity: 0.5; cursor: not-allowed; }
        .status-lead { background: #27272a; color: #a1a1aa; }
        .status-client { background: #064e3b; color: #6ee7b7; }
        .status-recurring { background: #7f1d1d; color: #fca5a5; }
        .stat-card { background: #1a1a1a; border: 1px solid #222; padding: 1.5rem; }
        .stat-card p:first-child { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #71717a; font-weight: 800; margin-bottom: 0.5rem; }
        .stat-card p:last-child { font-size: 2.5rem; font-weight: 900; font-style: italic; letter-spacing: -0.05em; line-height: 1; }
        select.input { cursor: pointer; }
        .lead-row { border-bottom: 1px solid #1a1a1a; transition: background 0.15s; }
        .lead-row:hover { background: #1a1a1a; }
    </style>
</head>
<body class="selection:bg-white selection:text-black">

    <!-- LOGIN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center px-6">
        <div class="w-full max-w-sm">
            <div class="border-b border-white/20 pb-4 mb-10 flex justify-between items-end uppercase font-black italic text-[10px] tracking-[0.3em]">
                <span>Sabaneta<br>Antioquia</span>
                <span class="text-red-600 text-lg">2026</span>
                <span class="text-right">Estudio<br>Privado</span>
            </div>

            <h1 class="text-[5rem] leading-[0.75] font-black uppercase italic tracking-tighter mb-12">
                <span class="block">Negas</span>
                <span class="block text-red-600">Admin</span>
            </h1>

            <div class="space-y-4">
                <div>
                    <label class="field-label">Email</label>
                    <input id="email" type="email" class="input" placeholder="admin@negas.tattoo">
                </div>
                <div>
                    <label class="field-label">Password</label>
                    <input id="password" type="password" class="input" placeholder="••••••••">
                </div>
                <p id="login-error" class="text-red-500 text-[11px] uppercase tracking-widest hidden">Credenciales incorrectas</p>
                <button id="login-btn" class="btn-red mt-2">Entrar</button>
            </div>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-screen" class="hidden min-h-screen">
        <div class="border-b border-white/10 px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black italic uppercase tracking-tighter">Negas <span class="text-red-600">Admin</span></h1>
            <button id="logout-btn" class="text-[11px] uppercase tracking-[0.2em] font-black text-zinc-500 hover:text-white transition">Salir</button>
        </div>

        <div class="px-6 py-8 max-w-6xl mx-auto space-y-10">

            <!-- STATS -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div class="stat-card">
                    <p>Total Leads</p>
                    <p id="stat-leads">0</p>
                </div>
                <div class="stat-card">
                    <p>Clientes</p>
                    <p id="stat-clients" class="text-emerald-400">0</p>
                </div>
                <div class="stat-card">
                    <p>Recurrentes</p>
                    <p id="stat-recurring" class="text-red-500">0</p>
                </div>
                <div class="stat-card">
                    <p>Conversion</p>
                    <p id="stat-conversion" class="text-white">0%</p>
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <!-- UPLOAD DOC -->
                <div class="border border-white/10 p-6 space-y-4">
                    <div class="flex justify-between items-end border-b border-white/10 pb-4">
                        <h2 class="text-2xl font-black italic uppercase tracking-tighter">Subir<br>Documento</h2>
                        <span class="text-red-600 text-[10px] uppercase tracking-widest font-black">Firmado</span>
                    </div>
                    <div>
                        <label class="field-label">Nombre del cliente</label>
                        <input id="doc-name" type="text" class="input" placeholder="Juan Perez">
                    </div>
                    <div>
                        <label class="field-label">Cedula</label>
                        <input id="doc-cedula" type="text" class="input" placeholder="123456789">
                    </div>
                    <div class="flex items-center gap-3">
                        <input id="doc-menor" type="checkbox" class="w-4 h-4 accent-red-600 cursor-pointer">
                        <label for="doc-menor" class="field-label mb-0 cursor-pointer">Menor de edad</label>
                    </div>
                    <div id="acudiente-section" class="hidden space-y-4 border-l-2 border-red-600 pl-4">
                        <div>
                            <label class="field-label">Nombre del acudiente</label>
                            <input id="doc-acudiente-nombre" type="text" class="input" placeholder="Maria Perez">
                        </div>
                        <div>
                            <label class="field-label">Cedula del acudiente</label>
                            <input id="doc-acudiente-cedula" type="text" class="input" placeholder="987654321">
                        </div>
                        <div>
                            <label class="field-label">Documento acudiente / Foto</label>
                            <input id="doc-acudiente-file" type="file" accept="image/*,.heic,.heif" class="w-full text-sm text-zinc-400 file:mr-4 file:py-2 file:px-4 file:border-0 file:bg-[#D20000] file:text-white file:font-bold file:text-xs file:uppercase file:cursor-pointer">
                        </div>
                    </div>
                    <div>
                        <label class="field-label">Archivo / Foto del cliente</label>
                        <input id="doc-file" type="file" accept="image/*,.heic,.heif" class="w-full text-sm text-zinc-400 file:mr-4 file:py-2 file:px-4 file:border-0 file:bg-[#D20000] file:text-white file:font-bold file:text-xs file:uppercase file:cursor-pointer">
                    </div>
                    <button id="upload-doc-btn" class="btn-red">Subir Documento</button>
                    <p id="doc-status" class="text-[11px] uppercase tracking-widest hidden"></p>
                </div>

                <!-- FILTER -->
                <div class="border border-white/10 p-6 space-y-4">
                    <div class="flex justify-between items-end border-b border-white/10 pb-4">
                        <h2 class="text-2xl font-black italic uppercase tracking-tighter">Filtrar<br>Leads</h2>
                        <span class="text-red-600 text-[10px] uppercase tracking-widest font-black">Estado</span>
                    </div>
                    <div>
                        <label class="field-label">Estado</label>
                        <select id="filter-status" class="input">
                            <option value="">Todos</option>
                            <option value="lead">Lead</option>
                            <option value="client">Cliente</option>
                            <option value="recurring">Recurrente</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- LEADS TABLE -->
            <div class="border border-white/10">
                <div class="flex justify-between items-end px-6 py-4 border-b border-white/10">
                    <h2 class="text-2xl font-black italic uppercase tracking-tighter">Leads</h2>
                    <div class="flex gap-4 items-center">
                        <span id="leads-count" class="text-red-600 text-[10px] uppercase tracking-widest font-black">0 registros</span>
                        <button id="deleted-leads-btn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 text-xs font-black uppercase rounded transition">Ver Eliminados</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="border-b border-white/10">
                                <th class="text-left px-6 py-3 field-label">Nombre</th>
                                <th class="text-left px-6 py-3 field-label">Email</th>
                                <th class="text-left px-6 py-3 field-label">Zona</th>
                                <th class="text-left px-6 py-3 field-label">Tamaño</th>
                                <th class="text-left px-6 py-3 field-label">Estado</th>
                                <th class="text-left px-6 py-3 field-label">Cambiar</th>
                            </tr>
                        </thead>
                        <tbody id="leads-table"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- DELETED LEADS MODAL -->
    <div id="deleted-leads-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-6 z-50">
        <div class="bg-[#1a1a1a] border border-white/10 max-w-2xl w-full max-h-[80vh] overflow-hidden flex flex-col">
            <div class="flex justify-between items-center px-6 py-4 border-b border-white/10">
                <h2 class="text-2xl font-black italic uppercase tracking-tighter">Leads Eliminados</h2>
                <button id="close-deleted-modal" class="text-zinc-500 hover:text-white transition text-xl">✕</button>
            </div>
            <div id="deleted-leads-list" class="overflow-y-auto flex-1 divide-y divide-white/10">
                <!-- Leads eliminados aquí -->
            </div>
            <div class="px-6 py-4 border-t border-white/10 text-[11px] text-zinc-500">
                <p id="deleted-count">0 leads eliminados</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase, getLeads, updateLeadStatus, getStats, uploadDocument, saveDocument } from '../supabase.js'

        const loginScreen = document.getElementById('login-screen')
        const adminScreen = document.getElementById('admin-screen')

        async function login() {
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            const errorEl = document.getElementById('login-error')
            const btn = document.getElementById('login-btn')

            btn.textContent = 'Entrando...'
            btn.disabled = true
            errorEl.classList.add('hidden')

            try {
                const { error } = await supabase.auth.signInWithPassword({ email, password })
                if (error) throw error
                showAdmin()
            } catch {
                errorEl.classList.remove('hidden')
                btn.textContent = 'Entrar'
                btn.disabled = false
            }
        }

        async function logout() {
            await supabase.auth.signOut()
            loginScreen.classList.remove('hidden')
            adminScreen.classList.add('hidden')
            document.getElementById('email').value = ''
            document.getElementById('password').value = ''
        }

        function showAdmin() {
            loginScreen.classList.add('hidden')
            adminScreen.classList.remove('hidden')
            loadDashboard()
        }

        const DELETED_KEY = 'deleted_leads'
        function getDeleted() { return new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || '[]')) }
        function deleteLead(id) {
            const d = getDeleted(); d.add(String(id))
            localStorage.setItem(DELETED_KEY, JSON.stringify([...d]))
        }
        function recoverLead(id) {
            const d = getDeleted(); d.delete(String(id))
            localStorage.setItem(DELETED_KEY, JSON.stringify([...d]))
        }

        let allLeads = []

        async function loadDashboard() {
            try {
                const [leads, stats] = await Promise.all([getLeads(), getStats()])
                allLeads = leads
                document.getElementById('stat-leads').textContent = stats.totalLeads
                document.getElementById('stat-clients').textContent = stats.totalClients
                document.getElementById('stat-recurring').textContent = stats.recurringClients
                document.getElementById('stat-conversion').textContent = stats.conversionRate + '%'
                renderLeads(leads)
            } catch (err) {
                console.error(err)
            }
        }

        function renderLeads(leads) {
            const filter = document.getElementById('filter-status').value
            const deleted = getDeleted()
            const filtered = leads
                .filter(l => !deleted.has(String(l.id)))
                .filter(l => !filter || l.status === filter)
            document.getElementById('leads-count').textContent = filtered.length + ' registros'
            document.getElementById('leads-table').innerHTML = filtered.map(lead => `
                <tr class="lead-row">
                    <td class="px-6 py-4">
                        <button class="delete-lead text-zinc-600 hover:text-red-600 transition text-xs font-black mr-2" data-delete-id="${lead.id}" title="Eliminar">✕</button>
                        <span class="font-bold italic cursor-pointer hover:text-red-500 transition" data-fill-name="${(lead.name || '').replace(/"/g, '&quot;')}" data-lead-id="${lead.id}" data-lead-status="${lead.status}">${lead.name || '—'}</span>
                    </td>
                    <td class="px-6 py-4 text-zinc-400 text-xs">${lead.email || '—'}</td>
                    <td class="px-6 py-4 text-zinc-400">${lead.tattoo_zone || '—'}</td>
                    <td class="px-6 py-4 text-zinc-400">${lead.size || '—'}</td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 text-xs font-black uppercase status-${lead.status}">${lead.status}</span>
                    </td>
                    <td class="px-6 py-4">
                        <select class="status-select bg-[#1a1a1a] border border-[#333] text-white text-xs p-1 font-bold uppercase cursor-pointer" data-lead-id="${lead.id}">
                            <option value="lead" ${lead.status === 'lead' ? 'selected' : ''}>Lead</option>
                            <option value="client" ${lead.status === 'client' ? 'selected' : ''}>Cliente</option>
                            <option value="recurring" ${lead.status === 'recurring' ? 'selected' : ''}>Recurrente</option>
                        </select>
                    </td>
                </tr>
            `).join('')
        }

        let selectedLeadId = null
        let selectedLeadStatus = null

        document.getElementById('leads-table').addEventListener('click', (e) => {
            const deleteBtn = e.target.closest('.delete-lead')
            if (deleteBtn) {
                deleteLead(deleteBtn.dataset.deleteId)
                renderLeads(allLeads)
                return
            }
            const cell = e.target.closest('[data-fill-name]')
            if (!cell) return
            selectedLeadId = cell.dataset.leadId
            selectedLeadStatus = cell.dataset.leadStatus
            document.getElementById('doc-name').value = cell.dataset.fillName
            document.getElementById('doc-name').scrollIntoView({ behavior: 'smooth', block: 'center' })
        })

        document.getElementById('doc-menor').addEventListener('change', (e) => {
            document.getElementById('acudiente-section').classList.toggle('hidden', !e.target.checked)
        })

        document.getElementById('leads-table').addEventListener('change', async (e) => {
            if (!e.target.classList.contains('status-select')) return
            const leadId = e.target.dataset.leadId
            await updateLeadStatus(leadId, e.target.value)
            loadDashboard()
        })

        document.getElementById('upload-doc-btn').addEventListener('click', async () => {
            const file = document.getElementById('doc-file').files[0]
            const name = document.getElementById('doc-name').value.trim()
            const cedula = document.getElementById('doc-cedula').value.trim()
            const esMenor = document.getElementById('doc-menor').checked
            const statusEl = document.getElementById('doc-status')
            const btn = document.getElementById('upload-doc-btn')

            if (!file || !name) { alert('Completa nombre y archivo'); return }

            btn.textContent = 'Subiendo...'
            btn.disabled = true

            try {
                const filePath = await uploadDocument(file, name, 'Negas')

                const docData = {
                    client_name: name,
                    cedula: cedula || null,
                    es_menor: esMenor,
                    tatuador: 'Negas',
                    file_url: filePath,
                    date: new Date().toISOString()
                }

                if (esMenor) {
                    const acudienteFile = document.getElementById('doc-acudiente-file').files[0]
                    docData.acudiente_nombre = document.getElementById('doc-acudiente-nombre').value.trim() || null
                    docData.acudiente_cedula = document.getElementById('doc-acudiente-cedula').value.trim() || null
                    if (acudienteFile) {
                        const acudientePath = await uploadDocument(acudienteFile, name + '-acudiente', 'Negas')
                        docData.acudiente_file_url = acudientePath
                    }
                }

                await saveDocument(docData)

                if (selectedLeadId) {
                    const nameMatch = (allLeads || []).filter(l =>
                        String(l.id) !== String(selectedLeadId) &&
                        (l.status === 'client' || l.status === 'recurring') &&
                        (l.name || '').toLowerCase() === name.toLowerCase()
                    )
                    const newStatus = nameMatch.length > 0 ? 'recurring'
                        : selectedLeadStatus === 'lead' ? 'client'
                        : selectedLeadStatus === 'client' ? 'recurring'
                        : null
                    if (newStatus) {
                        await updateLeadStatus(selectedLeadId, newStatus)
                        selectedLeadId = null
                        selectedLeadStatus = null
                    }
                }

                statusEl.textContent = '✓ Documento subido'
                statusEl.className = 'text-[11px] uppercase tracking-widest text-emerald-400'
                statusEl.classList.remove('hidden')
                document.getElementById('doc-file').value = ''
                document.getElementById('doc-name').value = ''
                document.getElementById('doc-cedula').value = ''
                document.getElementById('doc-menor').checked = false
                document.getElementById('acudiente-section').classList.add('hidden')
                document.getElementById('doc-acudiente-nombre').value = ''
                document.getElementById('doc-acudiente-cedula').value = ''
                document.getElementById('doc-acudiente-file').value = ''
            } catch (err) {
                statusEl.textContent = '✗ Error al subir'
                statusEl.className = 'text-[11px] uppercase tracking-widest text-red-500'
                statusEl.classList.remove('hidden')
            }

            btn.textContent = 'Subir Documento'
            btn.disabled = false
        })

        document.getElementById('filter-status').addEventListener('change', async () => {
            const leads = await getLeads()
            renderLeads(leads)
        })

        function renderDeletedModal() {
            const deleted = getDeleted()
            const deletedLeads = allLeads.filter(l => deleted.has(String(l.id)))
            const listEl = document.getElementById('deleted-leads-list')
            const countEl = document.getElementById('deleted-count')

            countEl.textContent = deletedLeads.length + ' leads eliminados'

            if (deletedLeads.length === 0) {
                listEl.innerHTML = '<div class="px-6 py-8 text-center text-zinc-500">No hay leads eliminados</div>'
                return
            }

            listEl.innerHTML = deletedLeads.map(lead => `
                <div class="px-6 py-4 flex justify-between items-center hover:bg-white/5 transition">
                    <div class="flex-1">
                        <p class="font-bold italic text-white">${lead.name || '—'}</p>
                        <p class="text-xs text-zinc-500">${lead.email || '—'}</p>
                    </div>
                    <button class="recover-lead bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 text-xs font-black uppercase rounded transition" data-recover-id="${lead.id}">Recuperar</button>
                </div>
            `).join('')

            document.querySelectorAll('.recover-lead').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    recoverLead(e.target.dataset.recoverId)
                    loadDashboard()
                    renderDeletedModal()
                })
            })
        }

        const deletedModal = document.getElementById('deleted-leads-modal')
        const deletedBtn = document.getElementById('deleted-leads-btn')
        const closeDeletedBtn = document.getElementById('close-deleted-modal')

        deletedBtn?.addEventListener('click', () => {
            renderDeletedModal()
            deletedModal.classList.remove('hidden')
            deletedModal.classList.add('flex')
        })

        closeDeletedBtn?.addEventListener('click', () => {
            deletedModal.classList.add('hidden')
            deletedModal.classList.remove('flex')
        })

        deletedModal?.addEventListener('click', (e) => {
            if (e.target === deletedModal) {
                deletedModal.classList.add('hidden')
                deletedModal.classList.remove('flex')
            }
        })

        document.getElementById('login-btn').addEventListener('click', login)
        document.getElementById('logout-btn').addEventListener('click', logout)
        document.getElementById('email').addEventListener('keypress', e => e.key === 'Enter' && login())
        document.getElementById('password').addEventListener('keypress', e => e.key === 'Enter' && login())

        const { data: { session } } = await supabase.auth.getSession()
        if (session) showAdmin()
    </script>
</body>
</html>
