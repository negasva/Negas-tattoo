<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Cotizacion | Negas Ink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #141414; --red: #D20000; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: #fff; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 2rem; }
        .text-stroke { -webkit-text-stroke: 1px rgba(255,255,255,0.3); color: transparent; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 2rem; padding: 1.5rem; max-width: 600px; margin: auto; width: 100%; }
        @media (min-width: 640px) { .card { padding: 3rem; } }
    </style>
</head>
<body class="selection:bg-white selection:text-black">

    <main class="card space-y-8">
        <div class="text-center">
            <h1 class="text-4xl font-black italic uppercase tracking-tighter mb-2">Solicitud Enviada</h1>
            <p class="text-zinc-500 uppercase text-[10px] tracking-widest">Resumen de tu proyecto</p>
        </div>

        <div class="space-y-4 border-y border-white/5 py-6 text-sm">
            <div class="flex justify-between"><span class="text-zinc-500 uppercase text-[10px] tracking-widest">Nombre:</span> <span id="res-nombre" class="font-bold italic"></span></div>
            <div class="flex justify-between"><span class="text-zinc-500 uppercase text-[10px] tracking-widest">Zona:</span> <span id="res-zona" class="font-bold italic"></span></div>
            <div class="flex justify-between"><span class="text-zinc-500 uppercase text-[10px] tracking-widest">Tamano:</span> <span id="res-tamano" class="font-bold italic"></span></div>
            <div class="flex justify-between"><span class="text-zinc-500 uppercase text-[10px] tracking-widest">Estilo:</span> <span id="res-estilo" class="font-bold italic"></span></div>
        </div>

        <div class="text-center py-6">
            <span class="text-zinc-500 uppercase text-[10px] tracking-widest block mb-2">Inversion Estimada</span>
            <div id="res-precio" class="text-[clamp(1.5rem,12vw,4.5rem)] font-black italic tracking-tighter text-white break-all leading-none px-2"></div>
        </div>

        <div class="space-y-6 text-center pt-6 border-t border-white/5">
            <a href="javascript:history.back()" class="block w-full bg-[#D20000] text-white py-4 rounded-full text-lg font-black uppercase italic tracking-tighter hover:bg-[#b00000] transition duration-500 transform hover:scale-[1.01] mb-6">
                Volver
            </a>
            <div class="flex justify-center gap-8 text-[10px] uppercase tracking-[0.3em] font-bold text-zinc-400">
                <a href="#" target="_blank" rel="noopener" class="js-ig hover:text-white transition">Instagram</a>
                <a href="#" target="_blank" rel="noopener" class="js-wa hover:text-white transition">WhatsApp</a>
            </div>

            <a href="#" class="js-wa-msg block text-[11px] uppercase tracking-[0.2em] font-black italic text-red-500 hover:text-white transition">
                Tienes dudas? Contactame
            </a>
        </div>
    </main>

    <script>
        function isMobileDevice() {
            return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
        }

        function getInstagramUsername(instagramUrl) {
            try {
                const url = new URL(instagramUrl);
                if (!/instagram\.com$/i.test(url.hostname) && !/www\.instagram\.com$/i.test(url.hostname)) {
                    return '';
                }

                const [username] = url.pathname.split('/').filter(Boolean);
                return username || '';
            } catch (_error) {
                return '';
            }
        }

        function openAppOrFallback(appUrl, webUrl) {
            if (!appUrl) {
                window.open(webUrl, '_blank', 'noopener');
                return;
            }

            const startedAt = Date.now();
            const fallbackDelay = 1200;
            const fallback = setTimeout(() => {
                if (Date.now() - startedAt < fallbackDelay + 250) {
                    window.location.href = webUrl;
                }
            }, fallbackDelay);

            const handleVisibilityChange = () => {
                if (document.hidden) {
                    clearTimeout(fallback);
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                }
            };

            document.addEventListener('visibilitychange', handleVisibilityChange);
            window.location.href = appUrl;
        }

        function bindDeepLinkAnchors() {
            document.querySelectorAll('a.js-wa, a.js-wa-msg, a.js-ig').forEach(anchor => {
                if (anchor.dataset.deepLinkBound === 'true') return;
                anchor.dataset.deepLinkBound = 'true';

                anchor.addEventListener('click', event => {
                    if (!isMobileDevice()) return;

                    const appHref = anchor.dataset.appHref;
                    const webHref = anchor.dataset.webHref || anchor.href;
                    if (!webHref) return;

                    event.preventDefault();
                    openAppOrFallback(appHref, webHref);
                });
            });
        }

        async function init() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                if (config.waPhone) {
                    document.querySelectorAll('a.js-wa').forEach(a => {
                        a.href = 'https://wa.me/' + config.waPhone;
                        a.dataset.webHref = 'https://wa.me/' + config.waPhone;
                        a.dataset.appHref = 'whatsapp://send?phone=' + config.waPhone;
                    });
                    document.querySelectorAll('a.js-wa-msg').forEach(a => {
                        const webHref = 'https://wa.me/' + config.waPhone + '?text=' + encodeURIComponent('Hola! Tengo dudas sobre mi cotizacion');
                        a.href = webHref;
                        a.dataset.webHref = webHref;
                        a.dataset.appHref = 'whatsapp://send?phone=' + config.waPhone + '&text=' + encodeURIComponent('Hola! Tengo dudas sobre mi cotizacion');
                    });
                }
                if (config.instagramUrl) {
                    const username = getInstagramUsername(config.instagramUrl);
                    document.querySelectorAll('a.js-ig').forEach(a => {
                        a.href = config.instagramUrl;
                        a.dataset.webHref = config.instagramUrl;
                        if (username) {
                            a.dataset.appHref = 'instagram://user?username=' + username;
                        }
                    });
                }
                bindDeepLinkAnchors();
            } catch (error) {
                console.error('Error cargando config en resumen:', error);
            }
        }
        init();

        const raw = localStorage.getItem('ultimaCotizacion');
        const datos = raw ? JSON.parse(raw) : null;
        if (datos) {
            document.getElementById('res-nombre').innerText = datos.cliente_nombre || 'No especificado';
            document.getElementById('res-zona').innerText = datos.zona_tatuaje || 'No especificada';
            document.getElementById('res-tamano').innerText = datos.tamano_final || 'No especificado';
            document.getElementById('res-estilo').innerText = datos.complejidad_diseno || 'No especificado';
            document.getElementById('res-precio').innerText = datos.cotizacion_estimada || 'No especificado';
        } else {
            window.location.href = '/';
        }
    </script>
</body>
</html>
