<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud Enviada | Negas Ink</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #121212; color: #fff; height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; overflow: hidden; }
        .field-label { font-size: 10px; text-transform: uppercase; letter-spacing: 3px; color: #52525b; font-weight: 800; }
        .wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 0; }
    </style>
</head>
<body class="selection:bg-white selection:text-black">

    <div class="wrap">

        <!-- HEADER BAR -->
        <div class="flex justify-between items-end pb-4 mb-6 border-b border-white/20 uppercase font-black italic text-[9px] tracking-[0.3em]">
            <span class="leading-tight">Sabaneta<br>Antioquia</span>
            <span class="text-red-600 text-base">✓</span>
            <span class="leading-tight text-right">Solicitud<br>Enviada</span>
        </div>

        <!-- TITLE -->
        <h1 class="text-[13vw] sm:text-[5.5rem] leading-none font-black uppercase italic tracking-tighter mb-6 whitespace-nowrap overflow-hidden">
            Listo<span class="text-red-600">!</span>
        </h1>

        <!-- DATA ROWS -->
        <div class="border-t border-white/10 mb-6">
            <div class="flex justify-between items-center py-3 border-b border-white/10">
                <span class="field-label">Nombre</span>
                <span id="res-nombre" class="font-black italic text-sm text-right ml-4 truncate max-w-[60%]"></span>
            </div>
            <div class="flex justify-between items-center py-3 border-b border-white/10">
                <span class="field-label">Zona</span>
                <span id="res-zona" class="font-black italic text-sm text-right"></span>
            </div>
            <div class="flex justify-between items-center py-3 border-b border-white/10">
                <span class="field-label">Tamano</span>
                <span id="res-tamano" class="font-black italic text-sm text-right"></span>
            </div>
            <div class="flex justify-between items-center py-3 border-b border-white/10">
                <span class="field-label">Estilo</span>
                <span id="res-estilo" class="font-black italic text-sm text-right"></span>
            </div>
        </div>

        <!-- PRICE -->
        <div class="mb-6">
            <span class="field-label block mb-2">Inversion Estimada</span>
            <div id="res-precio" class="text-[10vw] sm:text-[3.5rem] font-black italic tracking-tighter leading-none whitespace-nowrap overflow-hidden text-ellipsis"></div>
            <p class="text-[9px] text-zinc-600 mt-1 uppercase tracking-widest">Precio aproximado · Sujeto a confirmacion</p>
        </div>

        <!-- ACTIONS -->
        <div class="space-y-3">
            <a href="javascript:history.back()" class="block w-full text-center py-5 text-xl font-black uppercase italic tracking-tighter bg-[#D20000] hover:bg-[#b00000] transition duration-300">
                Volver
            </a>
            <div class="flex gap-3">
                <a href="#" target="_blank" rel="noopener" class="js-ig flex-1 text-center py-3 border border-white/20 hover:border-white text-[9px] font-black uppercase tracking-[0.3em] transition duration-300">Instagram</a>
                <a href="#" target="_blank" rel="noopener" class="js-wa flex-1 text-center py-3 border border-white/20 hover:border-white text-[9px] font-black uppercase tracking-[0.3em] transition duration-300">WhatsApp</a>
            </div>
            <a href="#" class="js-wa-msg block text-center text-[9px] uppercase tracking-[0.2em] font-black italic text-red-600 hover:text-white transition pt-1">
                Tienes dudas? Contactame
            </a>
        </div>

    </div>

    <script src="resumen.js"></script>
</body>
</html>
