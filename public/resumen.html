<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud Enviada | Negas Ink</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #fff; }
        .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #71717a; font-weight: 800; }
    </style>
</head>
<body class="selection:bg-white selection:text-black min-h-screen flex flex-col justify-center px-8 py-16">

    <div class="max-w-xl mx-auto w-full">

        <div class="w-full flex justify-between items-end mb-12 uppercase font-black italic text-[10px] tracking-[0.3em] border-b border-white/20 pb-4">
            <div class="text-left leading-tight">Sabaneta<br>Antioquia</div>
            <div class="text-red-600 text-lg">✓</div>
            <div class="text-right leading-tight">Solicitud<br>Enviada</div>
        </div>

        <h1 class="text-[16vw] sm:text-[10rem] leading-[0.75] font-black uppercase italic tracking-tighter mb-12">
            <span class="block">Listo</span>
            <span class="block text-red-600">!</span>
        </h1>

        <div class="space-y-0 border-t border-white/10 mb-12">
            <div class="flex justify-between items-center py-5 border-b border-white/10">
                <span class="field-label">Nombre</span>
                <span id="res-nombre" class="font-black italic text-lg text-right"></span>
            </div>
            <div class="flex justify-between items-center py-5 border-b border-white/10">
                <span class="field-label">Zona</span>
                <span id="res-zona" class="font-black italic text-lg text-right"></span>
            </div>
            <div class="flex justify-between items-center py-5 border-b border-white/10">
                <span class="field-label">Tamano</span>
                <span id="res-tamano" class="font-black italic text-lg text-right"></span>
            </div>
            <div class="flex justify-between items-center py-5 border-b border-white/10">
                <span class="field-label">Estilo</span>
                <span id="res-estilo" class="font-black italic text-lg text-right"></span>
            </div>
        </div>

        <div class="mb-12">
            <span class="field-label block mb-4">Inversion Estimada</span>
            <div id="res-precio" class="text-[clamp(2.5rem,15vw,6rem)] font-black italic tracking-tighter text-white leading-none"></div>
            <p class="text-[11px] text-zinc-600 mt-3 uppercase tracking-widest">Precio aproximado — sujeto a confirmacion</p>
        </div>

        <div class="space-y-4">
            <a href="javascript:history.back()" class="block w-full text-center py-8 text-3xl font-black uppercase italic tracking-tighter bg-[#D20000] hover:bg-[#b00000] transition duration-500" style="border-radius:0">
                Volver
            </a>

            <div class="flex gap-4 pt-4">
                <a href="#" target="_blank" rel="noopener" class="js-ig flex-1 text-center py-4 border border-white/20 hover:border-white text-[11px] font-black uppercase tracking-[0.3em] transition duration-300">Instagram</a>
                <a href="#" target="_blank" rel="noopener" class="js-wa flex-1 text-center py-4 border border-white/20 hover:border-white text-[11px] font-black uppercase tracking-[0.3em] transition duration-300">WhatsApp</a>
            </div>

            <a href="#" class="js-wa-msg block text-center text-[11px] uppercase tracking-[0.2em] font-black italic text-red-600 hover:text-white transition pt-2">
                Tienes dudas? Contactame
            </a>
        </div>

    </div>

    <script src="resumen.js"></script>
</body>
</html>
